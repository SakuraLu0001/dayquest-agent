name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -B -m pytest -q -p no:cacheprovider
      - run: python -B scripts/generate_synthetic_trace.py --check
      - run: python -B scripts/run_evaluation_slice.py --check
      - run: python -B scripts/run_branch_breadth_slice.py --check
      - run: python -B scripts/run_timeline_slice.py --check
      - run: python -B scripts/run_timeline_mvp.py --check
      - run: python -B scripts/run_comparison_benchmark.py --check
      - run: python -B scripts/run_product_v2.py --check
      - run: python -B scripts/scan_public_artifacts.py
